<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Chowka-Bhara</title>
<link rel="stylesheet" href="css/tokens.css?v=1.8.1">
<link rel="stylesheet" href="css/layout.css?v=1.8.1">
<link rel="stylesheet" href="css/screens.css?v=1.8.1">
<link rel="stylesheet" href="css/board.css?v=1.8.1">
<link rel="stylesheet" href="css/sidebar.css?v=1.8.1">
<link rel="stylesheet" href="css/online.css?v=1.8.1">
<link rel="stylesheet" href="css/contrast.css?v=1.8.1">
<link rel="stylesheet" href="css/a11y.css?v=1.8.1">
</head>
<body>
<div id="app">

  <div class="title-block">
    <h1>Chowka-Bhara</h1>
    <p data-i18n="app.tagline"></p>
  </div>

  <!-- ============================= SETUP SCREEN ============================= -->
  <div id="setup-screen">
    <div class="mat-panel">

      <div class="setup-tabs" role="tablist">
        <button class="setup-tab on" id="tab-local" role="tab" aria-selected="true"
                data-i18n="tab.local"></button>
        <button class="setup-tab" id="tab-host" role="tab" aria-selected="false"
                data-i18n="tab.host"></button>
        <button class="setup-tab" id="tab-join" role="tab" aria-selected="false"
                data-i18n="tab.join"></button>
      </div>

      <!-- ---------------------------------------------------- on this device -->
      <div class="setup-panel" id="panel-local" role="tabpanel">
        <!-- Board and player count belong to both playing tabs. Rather than two
             copies that can disagree, the one block is moved into whichever tab
             is showing, which keeps its state for free. It is written here, in
             the tab that opens first, so the page as served already looks the
             way it will once the script has run. -->
        <div class="panel-slot">
          <div id="game-settings">
            <div class="setup-section">
              <span class="setup-label" data-i18n="setup.board"></span>
              <div class="segmented" id="board-size-group">
                <input type="radio" name="board-size" id="size-5" value="5" checked>
                <label for="size-5">5 &times; 5<span class="sub" data-board="5"></span></label>
                <input type="radio" name="board-size" id="size-7" value="7">
                <label for="size-7">7 &times; 7<span class="sub" data-board="7"></span></label>
              </div>
            </div>

            <div class="setup-section">
              <span class="setup-label" data-i18n="setup.players"></span>
              <div class="segmented" id="num-players-group">
                <input type="radio" name="num-players" id="np-2" value="2" checked>
                <label for="np-2">2</label>
                <input type="radio" name="num-players" id="np-3" value="3">
                <label for="np-3">3</label>
                <input type="radio" name="num-players" id="np-4" value="4">
                <label for="np-4">4</label>
              </div>
            </div>
          </div>
        </div>

        <div class="setup-section">
          <span class="setup-label" data-i18n="setup.cpuPlayers"></span>
          <div class="segmented" id="num-cpu-group">
            <input type="radio" name="num-cpu" id="cpu-0" value="0" checked>
            <label for="cpu-0"><span data-i18n="setup.none"></span><span class="sub" data-i18n="setup.allHuman"></span></label>
            <input type="radio" name="num-cpu" id="cpu-1" value="1">
            <label for="cpu-1">1</label>
            <input type="radio" name="num-cpu" id="cpu-2" value="2">
            <label for="cpu-2">2</label>
            <input type="radio" name="num-cpu" id="cpu-3" value="3">
            <label for="cpu-3">3</label>
          </div>
        </div>

        <div class="setup-section" id="cpu-skill-section">
          <span class="setup-label" data-i18n="setup.cpuSkill"></span>
          <div class="segmented" id="cpu-skill-group">
            <input type="radio" name="cpu-skill" id="skill-easy" value="easy">
            <label for="skill-easy"><span data-i18n="setup.easy"></span><span class="sub" data-i18n="setup.easySub"></span></label>
            <input type="radio" name="cpu-skill" id="skill-sharp" value="sharp" checked>
            <label for="skill-sharp"><span data-i18n="setup.sharp"></span><span class="sub" data-i18n="setup.sharpSub"></span></label>
          </div>
        </div>

        <button class="begin-btn" id="begin-btn" data-i18n="setup.begin"></button>
      </div>

      <!-- --------------------------------------------------------- host online -->
      <div class="setup-panel" id="panel-host" role="tabpanel" hidden>
        <div class="panel-slot"></div>

        <div class="setup-section">
          <span class="setup-label" data-i18n="setup.cpuSkill"></span>
          <div class="segmented" id="host-skill-group">
            <input type="radio" name="host-skill" id="host-skill-easy" value="easy">
            <label for="host-skill-easy"><span data-i18n="setup.easy"></span><span class="sub" data-i18n="setup.easySub"></span></label>
            <input type="radio" name="host-skill" id="host-skill-sharp" value="sharp" checked>
            <label for="host-skill-sharp"><span data-i18n="setup.sharp"></span><span class="sub" data-i18n="setup.sharpSub"></span></label>
          </div>
        </div>

        <p class="setup-note" data-i18n="setup.hostNote"></p>
        <button class="begin-btn" id="host-btn" data-i18n="setup.openRoom"></button>
      </div>

      <!-- --------------------------------------------------------- join online -->
      <div class="setup-panel" id="panel-join" role="tabpanel" hidden>
        <div class="setup-section">
          <span class="setup-label" data-i18n="setup.roomCode"></span>
          <input id="join-code" class="code-input" maxlength="9" placeholder="BCDFH"
                 autocomplete="off" autocapitalize="characters" spellcheck="false">
        </div>

        <p class="setup-note" data-i18n="setup.joinNote"></p>
        <button class="begin-btn" id="join-btn" data-i18n="setup.joinRoom"></button>
      </div>

      <button class="a11y-btn" id="a11y-btn-setup" data-i18n="a11y.title"></button>
    </div>
  </div>

  <!-- ============================= LOBBY (ONLINE) ============================= -->
  <div id="lobby-screen" class="hidden">
    <div class="mat-panel">
      <p class="lobby-status" id="lobby-status" data-i18n="lobby.opening"></p>

      <div id="code-display" hidden>
        <span class="setup-label" data-i18n="setup.roomCode"></span>
        <div class="room-code" id="room-code"></div>
        <p class="code-hint" data-i18n-html="lobby.codeHint"></p>
      </div>

      <div class="setup-section">
        <span class="setup-label" data-i18n="lobby.seats"></span>
        <div id="seat-list"></div>
      </div>

      <p class="lobby-diag" id="lobby-diag"></p>

      <!-- Only while seats are still open. It qualifies the Start button, so it
           sits with it rather than in the button's own label. -->
      <div class="lobby-hint" id="lobby-hint" role="status" hidden></div>

      <button class="begin-btn" id="start-online-btn" hidden data-i18n="lobby.start"></button>
      <button class="lobby-back-btn" id="lobby-cancel-btn" data-i18n="lobby.back"></button>
    </div>
  </div>

  <!-- ============================= GAME SCREEN ============================= -->
  <div id="game-screen" class="hidden">
    <div class="mat-panel">

      <div class="board-col">
        <div class="board-wrap">
          <div id="board"></div>
        </div>
      </div>

      <div class="sidebar">
        <div class="turn-banner" id="turn-banner"></div>
        <div style="text-align:center"><span class="net-badge" id="net-badge" hidden></span></div>
        <div class="status-line" id="status-line"></div>

        <!-- Filled in by renderShellTray when a game starts: four cowries on
             the 5x5 board, six on the 7x7. -->
        <div class="shell-tray" id="shell-tray">
        </div>
        <button id="roll-btn"></button>

        <!-- Banked throws waiting to be spent this turn. -->
        <div class="pool" id="pool" hidden>
          <span class="pool-label" data-i18n="pool.label"></span>
          <div class="pool-chips" id="pool-chips"></div>
        </div>

        <div class="roster" id="roster"></div>

        <button class="howto-btn" id="howto-btn" data-i18n="howto.title"></button>

        <div id="log"></div>

        <!-- Below the log, where the settings are out of the way of play but
             still on the screen you are looking at while playing. -->
        <button class="a11y-btn" id="a11y-btn" data-i18n="a11y.title"></button>
        <div class="sidebar-foot">
          <button class="tie-btn" id="tie-btn" hidden data-i18n="btn.callTie"></button>
          <button class="new-game-btn" id="new-game-btn" data-i18n="btn.newGame"></button>
        </div>
      </div>

    </div>
  </div>

</div>

<div id="notice" class="notice" hidden></div>

<div id="a11y-drawer" class="drawer hidden">
  <div class="drawer-backdrop" id="a11y-backdrop"></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="a11y-heading">
    <div class="drawer-head">
      <h2 id="a11y-heading" data-i18n="a11y.title"></h2>
      <button class="drawer-close" id="a11y-close" aria-label="Close">&times;</button>
    </div>
    <div id="a11y-rows"></div>

    <div class="a11y-row">
      <div class="a11y-head"><span class="a11y-label" data-i18n="setup.language"></span></div>
      <p class="a11y-hint" data-i18n="a11y.languageHint"></p>
      <div class="segmented" id="lang-group"></div>
    </div>
  </aside>
</div>

<div id="howto-drawer" class="drawer hidden">
  <div class="drawer-backdrop" id="howto-backdrop"></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="howto-heading">
    <div class="drawer-head">
      <h2 id="howto-heading" data-i18n="howto.title"></h2>
      <button class="drawer-close" id="howto-close" aria-label="Close">&times;</button>
    </div>
    <ul id="howto-list"></ul>
  </aside>
</div>

<div id="pause-overlay" class="hidden">
  <div class="win-card">
    <p class="eyebrow" data-i18n="pause.title"></p>
    <p class="win-name" id="pause-name"></p>
    <p class="win-standings" id="pause-note"></p>
    <div class="win-actions">
      <button id="pause-cpu-btn" hidden data-i18n="pause.cpuTakeover"></button>
      <button id="pause-quit-btn" data-i18n="pause.leave"></button>
    </div>
  </div>
</div>

<div id="win-overlay" class="hidden">
  <div class="win-card">
    <p class="eyebrow" id="win-eyebrow">Reached the center</p>
    <p class="win-name"></p>
    <p class="win-standings" id="win-standings"></p>
    <div class="win-actions">
      <button id="play-on-btn" hidden data-i18n="win.playOn"></button>
      <button id="play-again-btn" data-i18n="win.playAgain"></button>
    </div>
  </div>
</div>

<script src="js/i18n.js?v=1.8.1"></script>
<script src="js/a11y.js?v=1.8.1"></script>
<script src="js/net.js?v=1.8.1"></script>
<script src="js/config.js?v=1.8.1"></script>
<script src="js/path.js?v=1.8.1"></script>
<script src="js/rules.js?v=1.8.1"></script>
<script src="js/ai.js?v=1.8.1"></script>
<script src="js/render.js?v=1.8.1"></script>
<script src="js/game.js?v=1.8.1"></script>
<script src="js/online.js?v=1.8.1"></script>
<script src="js/main.js?v=1.8.1"></script>
</body>
</html>
